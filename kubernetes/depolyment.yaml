---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-app-deployment
  namespace: development
  labels:
    app: learning-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-app
  template:
    metadata:
      labels:
        app: learning-app
    spec:
      containers:
        - name: learning-app-container
          image: uddipan32/trusnetix-web:latest
          ports:
            - containerPort: 3000
          